<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- resizes-content: on Android the keyboard shrinks the page, so the
         composer stays above it (src/lib/viewport.ts covers other browsers). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Narad — Avatāra</title>
    <meta name="color-scheme" content="light dark" />
    <!-- The status bar matches the dark header band: kajal by day, nila at night. -->
    <meta name="theme-color" content="#2d2a26" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1126" media="(prefers-color-scheme: dark)" />
    <!-- The service worker caches a page as the offline shell only if it has
         this marker, so a Cloudflare Access sign-in page never becomes it. -->
    <meta name="narad-shell" content="1" />
    <!-- use-credentials: behind Cloudflare Access an uncredentialed manifest
         fetch is redirected to the login page and Android will not install. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Narad" />
    <!-- Fonts are self-hosted (src/fonts.css) and cached with the app shell:
         nothing is fetched from another origin on first paint. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
