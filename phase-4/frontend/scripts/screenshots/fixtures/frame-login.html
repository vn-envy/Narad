<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in: power.example.com</title>
<style>
  body { margin: 0; font: 16px/1.4 system-ui, sans-serif; background: #eef3f0; color: #17231c; display: grid; place-items: center; height: 100vh; }
  .card { width: 440px; background: #fff; border-radius: 12px; padding: 32px 36px; box-shadow: 0 8px 30px rgba(0,0,0,.1); }
  h1 { margin: 0 0 6px; font-size: 26px; }
  p { margin: 0 0 22px; color: #5b6b62; }
  label { display: block; font-size: 14px; color: #34443b; margin: 14px 0 6px; }
  .input { border: 1px solid #b8c7bf; border-radius: 8px; height: 44px; }
  button { margin-top: 22px; width: 100%; height: 48px; background: #1b7a4a; color: #fff; border: 0; border-radius: 8px; font-size: 17px; font-weight: 700; }
</style>
</head>
<body>
<div class="card">
  <h1>Sign in</h1>
  <p>power.example.com · View and pay your bill</p>
  <label>Consumer number</label><div class="input"></div>
  <label>Password</label><div class="input"></div>
  <button>Sign in</button>
</div>
</body>
</html>
