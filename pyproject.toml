[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "narad-harness"
version = "0.1.0"
description = "Narad — a four-plane personal AI harness with cultural architecture (supervisor + 4 avataras, Smriti memory, Tapas learning, Dharma governance)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Neekhil Vatsa", email = "vatsaneekhil@gmail.com" }]

# Core runtime — server, routing, memory, learning loop.
dependencies = [
    "fastapi>=0.136.0,<0.137.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "sse-starlette>=3.4.0",
    "google-adk==1.32.0",
    "google-genai>=1.74.0,<1.75.0",
    "litellm>=1.83.0,<1.84.0",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    # Cloudflare Access JWT verification (phase-1/cf_access.py).
    "pyjwt[crypto]>=2.8",
    # AES-256-GCM for encrypted backups (scripts/narad_backup.py).
    "cryptography>=42",
    # Self-hosted Web Push to family phones (vahana_push.py): MPL-2.0, with
    # py-vapid (MPL-2.0) and http-ece (MIT).
    "pywebpush>=2.0,<3",
    "pydantic>=2.6.0",
    "nest_asyncio>=1.6.0",
    "numpy>=1.26.0",
    "sqlalchemy>=2.0.0",
    "turbovec>=0.7.0,<0.8.0",
]

[project.optional-dependencies]
# Skills that pull heavy or niche dependencies — install per need.
media = [
    "moviepy>=1.0.3",
    "Pillow>=10.0.0",
    "pydub>=0.25.1",
    "soundfile>=0.12.1",
    "scipy>=1.12.0",
    "midiutil>=1.2.1",
    "matplotlib>=3.8.0",
]
documents = [
    "PyMuPDF>=1.24.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
]
browser = ["playwright>=1.44.0"]
# Host desktop control is opt-in at runtime and always confirmation-gated.
computer = ["narad-harness[browser]", "pyautogui>=0.9.54"]
local-files = ["send2trash>=1.8.3"]
# Voice in/out: Kokoro-82M TTS (CPU-fast) + faster-whisper STT. Runs fully local.
voice = ["kokoro>=0.9.0", "faster-whisper>=1.0.0", "numpy>=1.26.0"]
# Local PII model for the privacy gateway (required before DeepSeek-tier
# providers are used with real family text). Runs on-device; MPS on Apple Silicon.
privacy = ["openmed[hf]>=2.5,<2.6", "torch>=2.2"]
# Local OCR for photographed and scanned documents (phase-8/ocr_skill.py):
# PaddleOCR PP-OCRv5 on CPU (Apache-2.0 code and weights; Devanagari + English),
# pillow-heif for iPhone HEIC photos, PyMuPDF to render scanned PDF pages.
# Surya 2 is the optional alternative (pip install surya-ocr; weights are
# under a modified OpenRAIL-M licence), chosen with NARAD_OCR_ENGINE=surya.
ocr = [
    "paddleocr>=3.1,<3.8",
    "paddlepaddle>=3.0",
    "pillow-heif>=0.18",
    "PyMuPDF>=1.24.0",
    "Pillow>=10.0.0",
]
dev = ["pytest>=8.0.0", "ruff>=0.6.0", "pre-commit>=3.7.0"]
all = ["narad-harness[media,documents,browser,computer,local-files]"]

[project.scripts]
narad-server = "narad_server_entry:main"

[tool.setuptools]
# Flat root modules. Phase dirs are registered by narad_paths at runtime
# until the physical package rename (see LAUNCH_CHECKLIST post-launch backlog).
py-modules = [
    "narad_paths",
    "narad_config",
    "narad_server_entry",
    "smriti_core",
    "smriti_vector_store",
    "smriti_indexer",
    "smriti_recall_ranker",
    "harness_contract",
    "decision_engine",
    "decision_contracts",
    "learning_workspace",
    "conversation_memory",
    "dharma",
    "anumati",
    "risk_policy",
    "privacy_gateway",
    "pilot_metrics",
    "pilot_scorecard",
    "tool_result",
    "init_workspace",
]

[tool.pytest.ini_options]
testpaths = ["phase-1", "phase-2", "phase-3", "phase-7", "phase-9"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 110
extend-exclude = ["phase-0a", "phase-0b", ".trash-to-delete", "phase-9/templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# E501/B008: FastAPI idioms. E402: the narad_paths bootstrap pattern requires
# imports after the sys.path hop in entry points, and legacy modules import
# lazily mid-file by design (graceful degradation when optional deps missing).
# B904/B905/B023/B005/B039/B007/E741: pre-existing legacy patterns, tracked in
# the post-launch backlog (LAUNCH_CHECKLIST.md) — fix opportunistically.
ignore = [
    "E501", "B008", "E402",
    "B904", "B905", "B023", "B005", "B039", "B007", "E741",
]
