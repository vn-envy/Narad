name: CI

on:
  push:
    branches: [main, clean-main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The speech splitter tests run the real TypeScript module through node
      # (22.6+ strips types natively); they skip without it.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Core runtime + dev tools only: the full suite needs no optional extras
      # (the live-browser test stays opt-in via NARAD_RUN_BROWSER_TESTS=1).
      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff (lint only, no format churn)
        run: ruff check .

      - name: Full suite (pytest)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phase-4/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: phase-4/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Service worker policy tests
        run: npm test
